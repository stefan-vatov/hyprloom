name: Release

# Triggered by pushing a version tag (e.g., v0.3.0)
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Validate release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          pkg_version="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$pkg_version"

      - name: Test all targets
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Create deterministic source archive
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          git archive --format=tar --prefix="hyprloom-${tag_version}/" \
            --mtime="1970-01-01 00:00:00 UTC" HEAD^{tree} -- \
            . ':(exclude)PKGBUILD' ':(exclude).SRCINFO' \
            | gzip -n > "hyprloom-${tag_version}.tar.gz"
          test -s "hyprloom-${tag_version}.tar.gz"
          tar -tzf "hyprloom-${tag_version}.tar.gz" >/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            target/release/hyprloom
            hyprloom-${{ steps.version.outputs.version }}.tar.gz

  # Publishes the updated PKGBUILD to AUR.
  # Required secret: AUR_SSH_PRIVATE_KEY
  #   - Generate: ssh-keygen -t ed25519 -C "hyprloom-aur" -f aur_key
  #   - Add public key to your AUR account: https://aur.archlinux.org/account
  #   - Add private key as repository secret AUR_SSH_PRIVATE_KEY
  aur-publish:
    name: Publish to AUR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute checksum
        id: checksum
        run: |
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            "https://github.com/stefan-vatov/hyprloom/releases/download/${GITHUB_REF_NAME}/hyprloom-${{ steps.version.outputs.version }}.tar.gz" \
            -o source.tar.gz
          test -s source.tar.gz
          tar -tzf source.tar.gz >/dev/null
          sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          # PKGBUILD keeps the checksum in a quoted shell variable for
          # readability.  .SRCINFO is the makepkg-generated, literal package
          # metadata and is already checked in with the tagged source.
          expected_sha256=$(awk '$1 == "sha256sums" && $2 == "=" { print $3; exit }' .SRCINFO)
          test -n "$expected_sha256"
          test "$sha256" = "$expected_sha256"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" \
            >> ~/.ssh/known_hosts
          printf '%s\n' "Host aur.archlinux.org" "  IdentityFile ~/.ssh/aur_key" "  User aur" \
            >> ~/.ssh/config

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/hyprloom.git aur-repo

      - name: Use tagged repository package metadata
        working-directory: aur-repo
        run: |
          cp "$GITHUB_WORKSPACE/PKGBUILD" PKGBUILD
          cp "$GITHUB_WORKSPACE/.SRCINFO" .SRCINFO

      - name: Validate Arch package
        working-directory: aur-repo
        run: |
          docker run --rm -v "$PWD":/pkg -w /pkg \
            archlinux@sha256:c9dc8b5d1b06d8d50ace6d42b2c93fbb1e34c9e1332d1a2102936e497d3187ae \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm base-devel rust
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c "makepkg --verifysource --nodeps"
              su builder -c "makepkg --nodeps --noconfirm"
              test -n "$(find /pkg -maxdepth 1 -type f -name "*.pkg.tar.*" -print -quit)"
            '

      - name: Generate .SRCINFO
        working-directory: aur-repo
        run: |
          docker run --rm -v "$PWD":/pkg -w /pkg \
            archlinux@sha256:c9dc8b5d1b06d8d50ace6d42b2c93fbb1e34c9e1332d1a2102936e497d3187ae bash -c "
            pacman -Syu --noconfirm base-devel &&
            useradd -m builder &&
            chown -R builder:builder /pkg &&
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          "

      - name: Fix ownership after docker
        working-directory: aur-repo
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Commit and push to AUR
        working-directory: aur-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR metadata is already current."
          else
            git commit -m "Update to ${{ steps.version.outputs.version }}"
            git push
          fi
