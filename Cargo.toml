[package]
name = "hyprloom"
version = "0.3.9"
edition = "2021"
description = "Save, restore, and reconcile Hyprland window sessions"
license = "MIT"
repository = "https://github.com/thethracian/hyprloom"
readme = "README.md"
keywords = ["hyprland", "wayland", "session", "restore"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
which = "8.0"
thiserror = "2"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
